[project]
name = "neon-agent"
version = "0.1.0"
description = "Agentic infrastructure planning for planners: constraints as data, deterministic generators, cited checks."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "shapely>=2.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pyproj>=3.7",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40", "mcp>=1.1"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.setuptools]
packages = ["domain", "checks", "catalog", "data", "generate", "tools", "agent", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
