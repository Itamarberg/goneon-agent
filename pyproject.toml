[project]
name = "neon-agent"
version = "0.1.0"
description = "Agentic infrastructure planning for planners: constraints as data, deterministic generators, cited checks."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "shapely>=2.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pyproj>=3.7",
    "scipy>=1.18.1",
    # The SDK is a core dependency; the *key* is optional. Without a key the
    # chat reports itself off and everything else works. A deployment that
    # installs only the core (Vercel installs from this list) must still be able
    # to talk to the model once the key is set.
    "anthropic>=0.69",
]

[project.optional-dependencies]
# MCP is opt-in: its dependency tree is heavier, and a serverless deployment
# cannot keep the sessions it needs across instances.
mcp = [
    "mcp>=2.0",
    # Not a runtime requirement: cryptography publishes no x86_64 macOS wheel for
    # its current release, so an Intel Mac tries to build it from source and
    # fails. Linux (the container) is unaffected; this keeps local dev working.
    "cryptography<46; platform_system == 'Darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.setuptools]
packages = ["domain", "checks", "catalog", "data", "generate", "tools", "agent", "api", "mcp_server"]

# Vercel: one function running the FastAPI app, the website promoted to the CDN.
[tool.vercel]
entrypoint = "api.main:app"

[tool.vercel.fastapi.static]
# The app has top-level middleware, which would otherwise keep the site inside
# the function. The site needs no middleware; serve it from the CDN.
cdn = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
