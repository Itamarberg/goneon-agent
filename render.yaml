services:
  - type: web
    name: neon-agent-api
    runtime: docker
    # Free tier sleeps after ~15 min idle; the first request back takes ~30 s.
    plan: free
    # Zurich users, Zurich data.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # The Vercel origin of the static site.
      - key: ALLOWED_ORIGINS
        sync: false
      # Only the API holds the key; the browser never sees it.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Hostnames MCP clients may reach this service on. "*" turns off the
      # Host-header check, which exists for servers running on a laptop.
      - key: MCP_ALLOWED_HOSTS
        sync: false
